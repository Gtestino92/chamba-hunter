[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamba-hunter"
version = "0.1.0"
description = "Local job search discovery, enrichment and tracking tool"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3"
]

[tool.setuptools.packages.find]
where = ["src"]